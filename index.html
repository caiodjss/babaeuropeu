<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    <script>
        // Configurações do repositório
        const repoName = 'babaeuropeu';
        const isGitHubPages = window.location.hostname.includes('github.io');
        
        // Caminhos base
        const basePath = isGitHubPages 
            ? `/${repoName}/`  // 
            : '/';             // 
        
        // Caminho completo para a home
        const homePath = `${basePath}src/pages/home.html`;
        
        // Função de redirecionamento
        const redirect = () => {
            // Verifica se o arquivo existe
            fetch(homePath)
                .then(response => {
                    if (response.ok) {
                        window.location.href = homePath;
                    } else {
                        throw new Error('Página não encontrada');
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    showError();
                });
        };
        
        // Mostra mensagem de erro
        const showError = () => {
            document.body.innerHTML = `
                <style>
                    body { 
                        font-family: Arial, sans-serif; 
                        max-width: 600px; 
                        margin: 0 auto; 
                        padding: 20px;
                        text-align: center;
                    }
                    a { color: #0366d6; }
                </style>
                <h1>Erro de Redirecionamento</h1>
                <p>Não foi possível carregar a página inicial.</p>
                <p><strong>Caminho tentado:</strong> ${homePath}</p>
                <p><a href="${homePath}">Tente manualmente</a></p>
                <h3>Verificações necessárias:</h3>
                <ul style="text-align: left;">
                    <li>O arquivo <strong>src/pages/home.html</strong> existe no repositório</li>
                    <li>No GitHub: Settings > Pages > Source está configurado para <strong>main branch</strong></li>
                    <li>O nome do repositório está correto no código (atual: '${repoName}')</li>
                </ul>
                <p><a href="https://github.com/caiodjss/${repoName}/settings/pages" target="_blank">Configurar GitHub Pages</a></p>
            `;
        };
        
        // Inicia o redirecionamento
        redirect();
    </script>
</head>
<body>
    <p>Redirecionando para a página inicial...</p>
</body>
</html>
