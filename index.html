<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redirecionando...</title>
    <script>
        // Verifica se estamos no GitHub Pages
        const isGitHubPages = window.location.hostname.includes('github.io');
        
        // Caminho base diferente para local vs GitHub Pages
        const basePath = isGitHubPages 
            ? '/caiodjss.github.io/babaeuropeu/src/pages/home.html' // 👈 Substitua pelo nome do seu repositório
            : '/';
        
        // Redirecionamento inteligente
        const redirect = () => {
            const targetUrl = basePath + 'babaeuropeu/src/pages/home.html';
            
            // Tenta acessar o arquivo primeiro
            fetch(targetUrl)
                .then(response => {
                    if (response.ok) {
                        window.location.href = targetUrl;
                    } else {
                        showError();
                    }
                })
                .catch(showError);
        };
        
        const showError = () => {
            document.body.innerHTML = `
                <h1>Erro de Redirecionamento</h1>
                <p>Não foi possível carregar a página inicial.</p>
                <p><a href="${basePath}src/pages/home.html">Tente manualmente</a></p>
                <p>Se estiver no GitHub Pages, verifique se:</p>
                <ul>
                    <li>O nome do repositório está correto no código</li>
                    <li>A opção "GitHub Pages" está configurada para publicar da branch main</li>
                </ul>
            `;
        };
        
        // Inicia o redirecionamento
        redirect();
    </script>
</head>
<body>
    <p>Redirecionando para a página inicial...</p>
</body>
</html>
